<!DOCTYPE html>
<html>
    
  <head>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <!-- Buttons on the left -->
    <div class="button left-buttons">
      <a href="Home.html" class="myButton">Home</button>
    </div>
    
    <!-- Buttons on the right -->
    <div class="button right-buttons">
      <button type="" class="myButton"></a>
      <button type="" class="myButton"></a>
      <button type="" class="myButton">Menu</a>
    </div>
    
    <!-- Button to access side menu -->
    <div class="menu-trigger" onclick="toggleMenu()">
      <alt="Menu" class="menu-icon">
    </div>

    <div class="logo">
      <img src="logo.jpg" alt="HY Gallery" class="logo-icon">
    </div>

    <!-- Slide menu to access the different pages-->
    <nav class="slide-menu" id="slideMenu">
      <a href="Home.html" class="menu-link">Home</a>
      <a href="Photos.html" class="menu-link">Photos</a>
      <a href="About.html" class="menu-link">About</a>
      <a href="Contact.html" class="menu-link">Contact</a>
    </nav>

    <!-- Photos -->
    <div class="photo-gallery">
      <div class="frame"><img src="Image1.JPG" alt=""><div class="caption">Taipei</div></div>
      <div class="frame"><img src="Image2.JPG" alt=""><div class="caption">Village</div></div>
      <div class="frame"><img src="Image3.JPG" alt=""><div class="caption">Beach</div></div>
      <div class="frame"><img src="Image4.JPG" alt=""><div class="caption">Dawn</div></div>
      <div class="frame"><img src="Image5.JPG" alt=""><div class="caption">Home</div></div>
      <div class="frame"><img src="Image6.jpg" alt=""><div class="caption">Shanghai</div></div>
    </div>

    <!-- Bottom text -->
    <div class="fixed-text">HY GALLERY</div>

    <!-- cited, to center the images everytime you reload page instead of starting on the most left/right -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const gallery = document.querySelector('.photo-gallery');
        const targetScroll = (853 + 50) * 2;  // 2nd photo position (width + gap * 1.5)
        gallery.scrollLeft = targetScroll;
      });
    </script>

    <!-- cited, to have the animation of sliding the menu -->
    <script>
      function toggleMenu() {
        document.getElementById('slideMenu').classList.toggle('active');
      }
    </script>

  </body>
</html>
